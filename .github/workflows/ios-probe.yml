name: iOS feasibility compile check
on:
  workflow_dispatch:
  push:
    branches: [ios/feasibility-probe]
    paths: ["ios/probe/**", ".github/workflows/ios-probe.yml", "runtime/recomp.h", "tools/lift.py", "tools/lift_simd.py", "tools/a64.py"]
permissions:
  contents: read
jobs:
  compile:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Test CPU helpers on runner (not an iPhone result)
        run: |
          clang -std=c11 -O2 -fno-fast-math -ffp-contract=off -DWS_PROBE_CLI -Iruntime ios/probe/cpu_probe.c -o /tmp/ws-cpu-probe
          /tmp/ws-cpu-probe
      - name: Generate and compare recompiled code to native ARM64
        run: |
          test "$(uname -m)" = arm64
          python3 ios/probe/generate_fixtures.py build/fixtures
          clang -std=c11 -O2 -fno-fast-math -ffp-contract=off -DWS_RECOMPILED_CLI -DWS_NATIVE_REFERENCE -Iruntime -Iios/probe ios/probe/recompiled_probe.c build/fixtures/fixtures.c build/fixtures/native_fixtures.S -o /tmp/ws-recompiled
          /tmp/ws-recompiled
      - name: Test Metal compute when runner exposes a GPU
        run: |
          clang -fobjc-arc -DWS_METAL_CLI ios/probe/metal_probe.m -framework Foundation -framework Metal -o /tmp/ws-metal
          /tmp/ws-metal
      - name: Configure iOS ARM64 project
        run: cmake -S ios/probe -B build/ios-probe -G Xcode -DCMAKE_SYSTEM_NAME=iOS -DCMAKE_OSX_SYSROOT=iphoneos -DCMAKE_OSX_ARCHITECTURES=arm64 -DCMAKE_OSX_DEPLOYMENT_TARGET=16.0
      - name: Compile unsigned device app
        run: xcodebuild -project build/ios-probe/WindowSmashProbe.xcodeproj -scheme WindowSmashProbe -configuration Release -sdk iphoneos -destination "generic/platform=iOS" -derivedDataPath build/derived CODE_SIGNING_ALLOWED=NO build
      - name: Verify and package unsigned IPA for local signing
        run: |
          APP=build/ios-probe/Release-iphoneos/WindowSmashProbe.app
          test -x "$APP/WindowSmashProbe"
          xcrun lipo "$APP/WindowSmashProbe" -verify_arch arm64
          plutil -lint "$APP/Info.plist"
          mkdir -p build/package/Payload
          ditto "$APP" build/package/Payload/WindowSmashProbe.app
          cd build/package
          ditto -c -k --keepParent Payload WindowSmashProbe-unsigned.ipa
          shasum -a 256 WindowSmashProbe-unsigned.ipa > SHA256SUMS.txt
      - name: Preserve unsigned IPA (requires signing before installation)
        uses: actions/upload-artifact@v4
        with:
          name: ios-probe-unsigned
          path: |
            build/package/WindowSmashProbe-unsigned.ipa
            build/package/SHA256SUMS.txt
          if-no-files-found: error
