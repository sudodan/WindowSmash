name: iOS feasibility compile check
on:
  workflow_dispatch:
  push:
    branches: [ios/feasibility-probe]
    paths: ["ios/probe/**", ".github/workflows/ios-probe.yml", "runtime/recomp.h"]
permissions:
  contents: read
jobs:
  compile:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Test CPU helpers on runner (not an iPhone result)
        run: |
          clang -std=c11 -O2 -fno-fast-math -ffp-contract=off -DWS_PROBE_CLI -Iruntime ios/probe/cpu_probe.c -o /tmp/ws-cpu-probe
          /tmp/ws-cpu-probe
      - name: Configure iOS ARM64 project
        run: cmake -S ios/probe -B build/ios-probe -G Xcode -DCMAKE_SYSTEM_NAME=iOS -DCMAKE_OSX_SYSROOT=iphoneos -DCMAKE_OSX_ARCHITECTURES=arm64 -DCMAKE_OSX_DEPLOYMENT_TARGET=16.0
      - name: Compile unsigned device app
        run: xcodebuild -project build/ios-probe/WindowSmashProbe.xcodeproj -scheme WindowSmashProbe -configuration Release -sdk iphoneos -derivedDataPath build/derived CODE_SIGNING_ALLOWED=NO build
      - name: Preserve unsigned build for inspection (not installable as-is)
        uses: actions/upload-artifact@v4
        with:
          name: ios-probe-unsigned
          path: build/derived/Build/Products/Release-iphoneos/WindowSmashProbe.app
          if-no-files-found: error
